[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Five-Knights-at-Trensteins"
version = "1.0.0"
description = "A Five Nights at Freddy's inspired survival game made with Pygame."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mason Rustad"}
]

dependencies = [
    "pygame>=2.5.0",
]

keywords = [
    "pygame",
    "fnaf",
    "game",
    "horror",
    "python"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]